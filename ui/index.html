<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MeteoDial</title>
    <link rel="icon" href="/assets/icon.ico" />
    <link rel="stylesheet" href="/ui/theme.css" />
    <link rel="stylesheet" href="/ui/style.css" />
    <link rel="stylesheet" href="/ui/shell.css" />
    <script type="module" src="/ui/app.js"></script>
  </head>
  <body>
    <a href="#content" class="skip">跳到内容</a>
    <header class="titlebar">
      <img src="/assets/brand/app-icon-32.png" width="24" height="24" alt="" /><span
        >MeteoDial</span
      >
    </header>
    <aside class="sidebar">
      <nav aria-label="主导航" id="nav"></nav>
      <div class="rail-bottom">
        <button type="button" class="nav-row" id="sources" aria-label="数据来源" title="数据来源">
          <span>数据来源</span>
        </button>
        <div class="rail-actions">
          <a href="#/settings" class="nav-row" id="settings-nav" aria-label="设置" title="设置"
            ><span>设置</span></a
          >
          <button id="pin" class="iconbtn" aria-label="取消固定侧栏" title="取消固定侧栏"></button>
        </div>
      </div>
    </aside>
    <div class="workspace">
      <header class="toolbar">
        <div class="page-title" id="breadcrumb"></div>
        <div class="tools">
          <button
            class="iconbtn"
            id="search"
            aria-label="搜索城市或区县"
            title="搜索城市或区县（Ctrl+K）"
          ></button
          ><span id="clock" class="clock"></span
          ><button id="tray" class="iconbtn" title="进入托盘" aria-label="进入托盘" hidden></button>
        </div>
      </header>
      <main id="content" tabindex="-1"><div class="loading">正在载入天气资料…</div></main>
    </div>
    <dialog id="dialog"><div id="dialog-body"></div></dialog>
    <div id="announce" aria-live="polite" class="sr"></div>
  </body>
</html>
